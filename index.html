<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow – Concept Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2A5C; --navy-2:#2B3D78; --ink:#16192B; --muted:#6B7085; --line:#E8E3D9;
  --cream:#F7F3EC; --cream-2:#EFE8DC; --white:#FFFFFF; --bg:#E9E4DA;
  --coffee:#8A5A3B; --matcha:#6E9A3C; --cold:#3E8FC4; --functional:#E08A2E; --free:#8C78B8; --tea:#B98A2F; --snack:#B5616A;
  --r:18px; --shadow:0 1px 2px rgba(22,25,43,.04),0 8px 24px rgba(22,25,43,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);font-family:"DM Sans",system-ui,-apple-system,sans-serif;color:var(--ink);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.serif{font-family:"Fraunces",Georgia,serif;font-weight:500;letter-spacing:-.01em}

/* phone shell */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{position:relative;width:390px;height:844px;background:var(--cream);border-radius:46px;overflow:hidden;box-shadow:0 0 0 10px #101322,0 30px 80px rgba(0,0,0,.35)}
@media (max-width:500px){.stage{padding:0;display:block}.phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:56px 20px 110px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.no-nav{padding-bottom:40px}
@media (max-width:500px){.screen{padding-top:calc(20px + env(safe-area-inset-top))}}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;padding:8px 10px calc(14px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.06em;color:#9A9DAD;width:64px;padding-top:6px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--navy)}

/* type + common */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px;line-height:1.2}
.sub{color:var(--muted)}
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--cream);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:14px;font-weight:700;letter-spacing:.04em;font-size:14px;background:var(--navy);color:#fff;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy)}
.btn.light{background:var(--cream);color:var(--navy)}
.btn.sm{width:auto;padding:10px 14px;font-size:12.5px;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;background:var(--white);box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;font-weight:500;transition:all .15s}
.chip.on{background:var(--navy);color:#fff;box-shadow:none}
.scroll-x{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.scroll-x::-webkit-scrollbar{display:none}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.03em}
.field input,.field select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none}
.field input:focus,.field select:focus{border-color:var(--navy)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.concept{font-size:10.5px;color:#9A9DAD;text-align:center;line-height:1.4}

/* home */
.greet-top{display:flex;justify-content:space-between;align-items:flex-start}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700}
.sim{margin-top:18px;background:var(--white);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.sim .chips{flex-wrap:nowrap}
.sim .chip{padding:7px 11px;font-size:12.5px;white-space:nowrap}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--white);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:17px}
.stat small{font-size:11px;color:var(--muted)}
.hero{position:relative;border-radius:22px;padding:20px;color:#fff;overflow:hidden;background:var(--navy)}
.hero .moment{font-size:11px;font-weight:700;letter-spacing:.16em;opacity:.8}
.hero .glow{position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;opacity:.55;filter:blur(2px)}
.prodline{display:flex;align-items:center;gap:12px;margin-top:14px;position:relative}
.pic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;flex:none}
.pic svg{width:30px;height:30px}
.hero .why{margin-top:14px;background:rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;font-size:13px;position:relative}
.why ul{list-style:none;margin-top:6px}
.why li{padding-left:16px;position:relative;margin-top:3px}
.why li:before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.hero .where{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;position:relative}
.hero .btn{background:#fff;color:var(--navy);margin-top:14px;position:relative}
.tl{position:relative;margin-top:10px}
.tl-item{display:flex;gap:12px;position:relative;padding-bottom:12px}
.tl-item .time{width:44px;font-size:12.5px;font-weight:700;color:var(--muted);padding-top:16px;flex:none}
.tl-item .card{flex:1;padding:14px}
.tl-item.past{opacity:.5}
.mini-moment{font-size:10.5px;font-weight:700;letter-spacing:.14em}
.why-toggle{font-size:12.5px;font-weight:600;color:var(--navy);margin-top:8px;display:inline-flex;gap:4px;align-items:center}
.why-box{background:var(--cream);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:8px;color:var(--ink)}

/* routine */
.rt{position:relative;margin-top:18px;padding-left:22px}
.rt:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.rt-item{position:relative;margin-bottom:12px}
.rt-item:before{content:"";position:absolute;left:-21px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--white);box-shadow:0 0 0 3px var(--c,var(--navy))}
.rt-item .card{padding:14px 14px 14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cream)}
.icon-btn svg{width:16px;height:16px}

/* nearby */
.map{position:relative;border-radius:22px;overflow:hidden;background:#EDE7DB;box-shadow:var(--shadow);margin-top:14px}
.map svg{display:block;width:100%;height:auto}
.marker{cursor:pointer;transition:transform .15s}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.route-banner{margin-top:14px;border-radius:18px;padding:14px 16px;background:var(--navy);color:#fff}
.route-banner .eyebrow{color:#A9C3FF}
.pt{display:flex;gap:12px;align-items:flex-start}
.pt-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.pt-ico svg{width:20px;height:20px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#E7F0DC;color:#4F7A22}

/* sheets */
.overlay{position:absolute;inset:0;background:rgba(16,19,34,.45);z-index:40;display:flex;align-items:flex-end;animation:ov .2s ease both}
@keyframes ov{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--cream);border-radius:26px 26px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1) both;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:#D5CFC3;margin:0 auto 14px}
.seg{display:flex;background:var(--white);border-radius:12px;padding:4px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}
.xsell{border-radius:16px;padding:14px;background:var(--white);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;gap:12px;align-items:center;transition:box-shadow .15s}
.xsell.on{box-shadow:inset 0 0 0 2px var(--matcha);background:#F4F8EE}
.check{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #C9C3B6;display:grid;place-items:center;flex:none}
.xsell.on .check{background:var(--matcha);box-shadow:none;color:#fff}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px}
.ready-ring{width:132px;height:132px;margin:8px auto 0;position:relative}
.ready-ring svg{transform:rotate(-90deg)}
.ready-ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.qr{background:#fff;border-radius:18px;padding:16px;display:grid;place-items:center;box-shadow:var(--shadow)}

/* my flow */
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--navy)}
.bars small{font-size:11px;color:var(--muted)}
.mix{display:flex;height:12px;border-radius:9px;overflow:hidden;margin-top:12px}
.habit{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.club{border-radius:22px;padding:20px;background:linear-gradient(135deg,#1B2A5C,#0F1734);color:#fff;position:relative;overflow:hidden}
.prog{height:8px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:#E8D5A8;border-radius:9px}
.tiers{display:flex;gap:6px;margin-top:14px}
.tiers span{flex:1;text-align:center;font-size:11px;font-weight:700;letter-spacing:.08em;padding:7px 0;border-radius:9px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
.tiers span.on{background:#E8D5A8;color:#1B2A5C}

/* profile */
.menu{background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.menu button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-top:1px solid var(--line);text-align:left}
.menu button:first-child{border-top:0}
.toggle{width:46px;height:28px;border-radius:99px;background:#D7D2C7;position:relative;flex:none;transition:background .2s}
.toggle:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--matcha)}
.toggle.on:after{transform:translateX(18px)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow small{display:block;color:var(--muted);font-size:12px}
.toast{position:absolute;left:20px;right:20px;bottom:100px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:13.5px;z-index:60;animation:fade .25s ease both}

/* onboarding */
.ob-hero{position:absolute;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:70px 28px calc(36px + env(safe-area-inset-bottom));overflow:hidden}
.ob-hero .orb{position:absolute;border-radius:50%}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--navy)}
.flow-step{display:flex;align-items:center;gap:10px;padding:10px 0;color:rgba(255,255,255,.85);font-size:14px}
.flow-step b{color:#fff}
</style>
</head>
<body>
<div class="stage"><div class="phone" id="app"></div></div>

<script>
/* ================= DATA ================= */
const CAT = {
  coffee:{label:"Coffee",color:"var(--coffee)",hex:"#8A5A3B"},
  cold:{label:"Cold drinks",color:"var(--cold)",hex:"#3E8FC4"},
  matcha:{label:"Matcha",color:"var(--matcha)",hex:"#6E9A3C"},
  tea:{label:"Tea",color:"var(--tea)",hex:"#B98A2F"},
  functional:{label:"Functional",color:"var(--functional)",hex:"#E08A2E"},
  protein:{label:"Protein",color:"var(--snack)",hex:"#B5616A"},
  free:{label:"Caffeine-free",color:"var(--free)",hex:"#8C78B8"},
  food:{label:"Food & snacks",color:"var(--snack)",hex:"#B5616A"}
};
const P = {
  espresso:{name:"Espresso",cat:"coffee",price:1.40,caf:65,prep:2,milk:false,desc:"Single origin blend, short and intense"},
  cappuccino:{name:"Cappuccino",cat:"coffee",price:2.20,caf:65,prep:3,milk:true,desc:"Espresso with velvety steamed milk"},
  coldbrew:{name:"Cold Brew",cat:"cold",price:3.50,caf:150,prep:1,milk:false,desc:"Steeped 16 hours, smooth and low acidity"},
  icedcoffee:{name:"Iced Latte",cat:"cold",price:3.20,caf:65,prep:3,milk:true,desc:"Espresso over ice with cold milk"},
  matcha:{name:"Iced Matcha Latte",cat:"matcha",price:4.20,caf:60,prep:4,milk:true,desc:"Ceremonial-grade matcha, whisked to order"},
  chai:{name:"Chai Latte",cat:"tea",price:3.60,caf:40,prep:3,milk:true,desc:"Black tea with cardamom, cinnamon and ginger"},
  greentea:{name:"Premium Green Tea",cat:"tea",price:2.80,caf:30,prep:2,milk:false,desc:"Japanese sencha, light and fresh"},
  electrolyte:{name:"Electrolyte Hydration Drink",cat:"functional",price:2.90,caf:0,prep:1,milk:false,desc:"Sodium, potassium and magnesium, lightly citrus"},
  focus:{name:"Focus Drink",cat:"functional",price:3.20,caf:40,prep:1,milk:false,desc:"Green tea caffeine with B vitamins and magnesium"},
  protein:{name:"Protein Shake",cat:"protein",price:3.90,caf:0,prep:2,milk:true,desc:"20 g protein, cocoa or vanilla"},
  botanical:{name:"Botanical Tea",cat:"free",price:2.60,caf:0,prep:2,milk:false,desc:"Chamomile, lemon balm and orange peel"},
  cornetto:{name:"Cornetto",cat:"food",price:1.50,caf:0,prep:0,food:true,desc:"Freshly baked every morning"},
  proteinbar:{name:"Protein Bar",cat:"food",price:2.50,caf:0,prep:0,food:true,desc:"Almond & dark chocolate, 15 g protein"},
  proteinsnack:{name:"Protein Snack",cat:"food",price:2.20,caf:0,prep:0,food:true,desc:"Roasted chickpeas & seeds"},
  sandwich:{name:"Focaccia Sandwich",cat:"food",price:4.50,caf:0,prep:0,food:true,desc:"Mozzarella, tomato and basil"},
  yogurt:{name:"Yogurt Bowl",cat:"food",price:3.80,caf:0,prep:0,food:true,desc:"Greek yogurt, granola and berries"}
};
const TYPES = {
  store:{label:"Flow Store",color:"#1B2A5C",desc:"Full experience, complete portfolio"},
  corner:{label:"Flow Corner",color:"#8A5A3B",desc:"Small counter, fast pick-up"},
  machine:{label:"Flow Machine",color:"#6E9A3C",desc:"Smart vending, 24/7 pre-order"}
};
const ALL_DRINKS = Object.keys(P).filter(k=>!P[k].food);
const POINTS = [
  {id:"luiss",name:"LUISS Viale Romania",type:"machine",x:172,y:58,dist:"80 m",walk:"1 min",hours:"07:00 – 22:00",products:["espresso","cappuccino","coldbrew","matcha","focus","electrolyte","greentea","proteinbar","cornetto"]},
  {id:"policlinico",name:"Metro Policlinico",type:"corner",x:205,y:150,dist:"350 m",walk:"4 min",hours:"06:30 – 21:00",products:["espresso","cappuccino","icedcoffee","matcha","chai","focus","cornetto","proteinbar","yogurt"]},
  {id:"bologna",name:"Piazza Bologna",type:"corner",x:268,y:126,dist:"1.1 km",walk:"13 min",hours:"07:00 – 22:00",products:["espresso","cappuccino","coldbrew","electrolyte","protein","greentea","proteinsnack","proteinbar","sandwich"]},
  {id:"termini",name:"Roma Termini",type:"store",x:178,y:226,dist:"2.4 km",walk:"9 min metro",hours:"05:30 – 23:30",products:ALL_DRINKS.concat(["cornetto","proteinbar","proteinsnack","sandwich","yogurt"])},
  {id:"borghese",name:"Villa Borghese",type:"machine",x:108,y:120,dist:"1.9 km",walk:"22 min",hours:"24/7",products:["espresso","coldbrew","matcha","electrolyte","botanical","proteinbar"]},
  {id:"tiburtina",name:"Stazione Tiburtina",type:"machine",x:298,y:206,dist:"700 m",walk:"8 min",hours:"24/7",products:["espresso","cappuccino","greentea","botanical","electrolyte","chai","proteinsnack"]},
  {id:"eur",name:"EUR – Viale Europa",type:"store",x:44,y:282,dist:"9.8 km",walk:"25 min metro",hours:"07:00 – 21:00",products:ALL_DRINKS.concat(["cornetto","proteinbar","sandwich","yogurt"])}
];
const RCAT = {
  commute:{label:"Commute",c:"#9A9DAD"}, study:{label:"Study",c:"#1B2A5C"}, work:{label:"Work",c:"#2B3D78"},
  meal:{label:"Meal",c:"#B5616A"}, sport:{label:"Sport",c:"#E08A2E"}, free:{label:"Free time",c:"#8C78B8"}, home:{label:"Home",c:"#6E9A3C"}
};

/* ================= STATE ================= */
const S = {
  onboarded:false, obStep:0,
  user:{name:"Antonio",age:22,occ:"Student",prefs:["coffee","matcha","cold","functional"],caffeine:"Moderate",diet:"None",wake:"07:15",sleep:"23:30"},
  consent:{personal:true,location:true,calendar:false,history:true,offers:false},
  routine:[
    {id:1,time:"08:00",title:"Leave home",place:"Via Nomentana",cat:"commute"},
    {id:2,time:"08:45",title:"University – LUISS",place:"Viale Romania, Roma",cat:"study"},
    {id:3,time:"13:00",title:"Lunch with friends",place:"LUISS campus",cat:"meal"},
    {id:4,time:"15:00",title:"Library session",place:"Biblioteca LUISS",cat:"study"},
    {id:5,time:"18:30",title:"Gym",place:"FitLab, Piazza Bologna",cat:"sport"},
    {id:6,time:"21:00",title:"Dinner at home",place:"Via Nomentana",cat:"home"}
  ],
  nextId:7,
  tab:"home", simTime:"08:00", openWhy:null,
  sheet:null, // {kind, ...}
  points:1240, plus:false,
  week:{drinks:8,places:4,spent:32,mix:{coffee:3,cold:2,functional:2,tea:1},days:[1,2,1,0,2,1,1]},
  ordered:[], // today's orders: {pid,time}
  mapFilter:"all", mapSel:null, toast:null
};
const SIM_TIMES = ["08:00","12:30","15:00","18:00","21:00"];

/* ================= HELPERS ================= */
const $ = s=>document.querySelector(s);
const min = t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
const hhmm = m=>{m=Math.max(0,m);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const eur = n=>"€"+n.toFixed(2).replace(".",",");
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pt = id=>POINTS.find(p=>p.id===id);
const sorted = ()=>[...S.routine].sort((a,b)=>min(a.time)-min(b.time));
function pointFor(ev){
  const s=(ev.place+" "+ev.title).toLowerCase();
  if(/luiss|univers|librar|bibliotec|romania/.test(s)) return "luiss";
  if(/gym|palestr|bologna|fitlab/.test(s)) return "bologna";
  if(/home|casa|nomentana/.test(s)) return "tiburtina";
  if(/termini/.test(s)) return "termini";
  if(/eur/.test(s)) return "eur";
  if(/borghese/.test(s)) return "borghese";
  return "policlinico";
}
function toast(msg){S.toast=msg;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast=null;render()},2200)}

/* ================= RECOMMENDATION ENGINE ================= */
function buildFlow(){
  const out=[]; const ev=sorted();
  const likes=k=>S.user.prefs.includes(k);
  const lowCaf=S.user.caffeine==="Low"||S.user.caffeine==="None";
  let coffees=S.user.caffeine==="None"?0:1; // habitual coffee at home
  let caf=coffees*65;
  ev.forEach((e,i)=>{
    const t=min(e.time); const next=ev[i+1];
    let r=null; const why=[];
    if(e.cat==="commute") return;
    if((e.cat==="study"||e.cat==="work") && t<12*60){
      const pid = lowCaf ? (likes("matcha")?"matcha":"greentea") : (coffees>=2?"matcha":"espresso");
      const pair = next&&next.cat==="meal" && min(next.time)-t>180 ? "proteinbar" : "cornetto";
      r={moment:"FOCUS",title:"Start focused",pid,pair,slot:t-30,label:"Before "+(e.cat==="study"?"class":"work")};
      why.push(`You have ${e.title.split(" –")[0].toLowerCase()} at ${e.time}`);
      why.push(pid==="espresso"?"You usually pick espresso in the morning":"You prefer lower caffeine");
      if(next) why.push(`Your next break is at ${next.time}`);
    } else if(e.cat==="meal" && t<16*60){
      const pid = coffees>=2 ? (likes("tea")?"greentea":"greentea") : (likes("cold")?"coldbrew":"cappuccino");
      r={moment:"FUEL",title:"Lunch break",pid,pair:"sandwich",slot:t-10,label:"Lunch"};
      why.push(`Lunch is at ${e.time}`);
      why.push(coffees>=2?`You already had ${coffees} coffees today`:"A cold coffee pairs well with a light lunch");
    } else if((e.cat==="study"||e.cat==="work") && t<19*60){
      const pid = coffees>=2 || caf>=200 ? (likes("matcha")?"matcha":"chai") : (likes("cold")?"icedcoffee":"cappuccino");
      const dur = next?Math.round((min(next.time)-t)/60):2;
      r={moment:"REFRESH",title:"Refresh",pid,pair:"proteinbar",slot:t+30,label:"During study"};
      why.push(`You have a ${dur}-hour ${e.cat==="study"?"study":"work"} session`);
      if(likes("cold")) why.push("You usually choose cold drinks in the afternoon");
      if(coffees>=2) why.push(`You already had ${coffees} coffees today`);
    } else if(e.cat==="sport"){
      r={moment:"FUEL",title:"Hydrate",pid:"electrolyte",pair:"proteinsnack",slot:t-30,label:"Before workout"};
      why.push(`Your workout starts at ${e.time}`);
      why.push("Caffeine-free, so it won't affect your evening");
      why.push("Pick-up point is next to your gym");
    } else if(e.cat==="home"||e.cat==="meal"||t>=19*60){
      r={moment:"UNWIND",title:"Slow down",pid:"botanical",pair:null,slot:Math.max(t-20,19*60),label:"Evening"};
      why.push(`You usually go to sleep at ${S.user.sleep}`);
      why.push("Caffeine-free after 19:00");
    } else {
      r={moment:"RESET",title:"Reset",pid:"greentea",pair:null,slot:t-15,label:RCAT[e.cat].label};
      why.push(`You have “${e.title}” at ${e.time}`);
    }
    r.ev=e; r.point=pointFor(e); r.why=why; r.id="r"+e.id;
    r.detour = r.point==="policlinico"?3:r.point==="luiss"?0:2;
    if(P[r.pid].cat==="coffee"||r.pid==="coldbrew"||r.pid==="icedcoffee") coffees++;
    caf+=P[r.pid].caf;
    out.push(r);
  });
  // morning first rec goes to Policlinico (on route)
  const f=out.find(o=>o.moment==="FOCUS"); if(f){f.point="policlinico";f.detour=3}
  return out;
}
const MOM = {FOCUS:"#8A5A3B",REFRESH:"#6E9A3C",FUEL:"#E08A2E",RESET:"#B98A2F",UNWIND:"#8C78B8"};
function crossSellText(r, pair){
  if(!pair) return "";
  const ev=sorted(); const idx=ev.findIndex(e=>e.id===r.ev.id); const next=ev[idx+1];
  if(pair==="proteinbar"&&next&&next.cat==="meal") return `You have lunch in ${Math.round((min(next.time)-r.slot)/60)} hours. Add a Protein Bar for ${eur(P.proteinbar.price)}.`;
  if(pair==="proteinsnack") return `You're heading to the gym. Complete your Flow with a Protein Snack.`;
  if(pair==="sandwich") return `Skip the lunch queue: add a Focaccia Sandwich, ready with your drink.`;
  if(pair==="cornetto") return `Leaving early? Add a fresh Cornetto for ${eur(P.cornetto.price)}.`;
  if(pair==="proteinbar") return `Long session ahead. Add a Protein Bar for ${eur(P.proteinbar.price)}.`;
  return `Pairs well with ${P[pair].name}.`;
}

function qr(seed){
  let x=seed; const rnd=()=>{x=(x*9301+49297)%233280;return x/233280};
  const n=25,c=6; let r="";
  const finder=(a,b)=>`<rect x="${a*c}" y="${b*c}" width="${7*c}" height="${7*c}" fill="#16192B"/><rect x="${a*c+c}" y="${b*c+c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${a*c+2*c}" y="${b*c+2*c}" width="${3*c}" height="${3*c}" fill="#16192B"/>`;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const inF=(i<8&&j<8)||(i<8&&j>=n-8)||(i>=n-8&&j<8); if(inF) continue;
    if(rnd()>.52) r+=`<rect x="${i*c}" y="${j*c}" width="${c}" height="${c}" fill="#16192B"/>`;
  }
  return `<svg width="150" height="150" viewBox="0 0 ${n*c} ${n*c}" aria-label="Pick-up QR code (simulated)">${r}${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}

function place(total){
  const s=S.sheet; const earned=Math.round(total*10*(S.plus?2:1));
  S.points+=earned; S.week.drinks++; S.week.spent+=total; S.week.days[2]++;
  const cat=P[s.pid].cat; const key=cat==="matcha"?"cold":cat==="free"||cat==="protein"?"functional":cat; S.week.mix[key]=(S.week.mix[key]||0)+1;
  S.ordered.push({pid:s.pid,time:S.simTime});
  const items=P[s.pid].name+(s.addPair&&s.pair?" + "+P[s.pair].name:"");
  S.sheet={kind:"done",no:1000+Math.floor(Math.random()*9000),left:240,items,point:s.point,earned};
  clearInterval(timer);
  timer=setInterval(()=>{if(!S.sheet||S.sheet.kind!=="done"){clearInterval(timer);return} S.sheet.left=Math.max(0,S.sheet.left-20); if(!S.sheet.left)clearInterval(timer); render()},700);

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  if(a==="closeBg"){ if(e.target===el){S.sheet=null;render()} return; }
  if(S.sheet){const sh=document.querySelector(".sheet"); if(sh) S.sheet._scroll=sh.scrollTop;}
  switch(a){
    case "demo": S.onboarded=true; S.tab="home"; break;
    case "ob": saveObFields(); S.obStep=+v; break;
    case "finish": saveObFields(); S.onboarded=true; S.tab="home"; break;
    case "occ": S.user.occ=v; break;
    case "pref": {const i=S.user.prefs.indexOf(v); i>=0?S.user.prefs.splice(i,1):S.user.prefs.push(v); break;}
    case "caf": S.user.caffeine=v; break;
    case "consent": S.consent[v]=!S.consent[v]; if(v==="calendar"&&S.consent[v]) {S.consent[v]=false; toast("Calendar sync is coming soon"); return} break;
    case "tab": S.tab=v; S.mapSel=null; break;
    case "sim": S.simTime=v; S.openWhy=null; break;
    case "why": S.openWhy=S.openWhy===v?null:v; break;
    case "order": {const r=buildFlow().find(x=>x.id===v); openOrder(r); break;}
    case "orderAt": e.stopPropagation(); openOrder(null,v); break;
    case "close": S.sheet=null; break;
    case "size": S.sheet.size=+v; break;
    case "milk": S.sheet.milk=v; break;
    case "sweet": S.sheet.sweet=v; break;
    case "pair": S.sheet.addPair=!S.sheet.addPair; break;
    case "place": place(+v); break;
    case "point": return;
    case "addEv": S.sheet={kind:"ev",isNew:true,ev:{time:"10:00",title:"",place:"",cat:"study"}}; break;
    case "editEv": S.sheet={kind:"ev",ev:{...S.routine.find(x=>x.id==v)}}; break;
    case "delEv": S.routine=S.routine.filter(x=>x.id!=v); toast("Activity removed – your Flow has been updated"); return;
    case "saveEv": {
      const ev={time:$("#e-time").value||"10:00",title:$("#e-title").value.trim()||"Activity",place:$("#e-place").value.trim(),cat:$("#e-cat").value};
      if(S.sheet.isNew){S.routine.push({id:S.nextId++,...ev})} else {Object.assign(S.routine.find(x=>x.id===S.sheet.ev.id),ev)}
      S.sheet=null; toast("Routine saved – recommendations updated"); return;
    }
    case "cal": toast("Google & Apple Calendar sync: coming soon"); return;
    case "filter": S.mapFilter=v; S.mapSel=null; break;
    case "mapSel": S.mapSel=v; break;
    case "plus": S.sheet={kind:"plus"}; break;
    case "togglePlus": S.plus=!S.plus; S.sheet=null; toast(S.plus?"Welcome to Flow+":"Flow+ cancelled"); return;
    case "data": S.sheet={kind:"data"}; break;
    case "strategy": S.sheet={kind:"strategy"}; break;
    case "wipe": S.week={drinks:0,places:0,spent:0,mix:{coffee:0,cold:0,functional:0,tea:0},days:[0,0,0,0,0,0,0]}; S.ordered=[]; S.sheet=null; toast("Order history deleted"); return;
    case "restart": S.onboarded=false; S.obStep=0; S.sheet=null; break;
  }
  render();
});
document.addEventListener("change",e=>{
  if(e.target.dataset.a==="point"&&S.sheet){S.sheet.point=e.target.value; S.sheet._scroll=document.querySelector(".sheet").scrollTop; render()}
});
render();
</script>
</body>
</html>
